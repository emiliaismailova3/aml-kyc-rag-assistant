[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # langchain-community announces its own sunset on import; it's still the
    # source of PyPDFLoader (see README, Known limitations).
    "ignore:.*langchain-community.*:DeprecationWarning",
]
