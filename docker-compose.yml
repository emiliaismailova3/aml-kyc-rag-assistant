services:
  api:
    build: .
    command: ["api"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # On a fresh volume the API container first builds the Chroma index
      # (a few minutes on CPU) before uvicorn starts; without a start period
      # the healthcheck gave up after ~50 s and the UI never started.
      start_period: 15m

  ui:
    build: .
    command: ["ui"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  # --- Optional services for the document-assistant features -----------------
  # Not started by a plain `docker compose up` (so the existing quickstart and CI
  # smoke test are unchanged). Start them with:
  #   docker compose --profile full up -d postgres redis
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["full"]
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
      POSTGRES_RO_PASSWORD: assistant_ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Celery worker + beat scheduler for the data collector. They store into PostgreSQL
  # (Chroma is not safe for two processes writing at once).
  worker:
    build: .
    command: ["worker"]
    profiles: ["full"]
    env_file:
      - .env
    environment: &collector_env
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://assistant:assistant@postgres:5432/assistant
      VECTOR_BACKEND: pgvector
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: ["beat"]
    profiles: ["full"]
    env_file:
      - .env
    environment: *collector_env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
