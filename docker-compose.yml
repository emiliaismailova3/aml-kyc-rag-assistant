services:
  api:
    build: .
    command: ["api"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # On a fresh volume the API container first builds the Chroma index
      # (a few minutes on CPU) before uvicorn starts; without a start period
      # the healthcheck gave up after ~50 s and the UI never started.
      start_period: 15m

  ui:
    build: .
    command: ["ui"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
